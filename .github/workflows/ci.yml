name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ansible>=9,<12" "ansible-lint>=25"
      - run: ansible-playbook playbooks/site.yml --syntax-check
      - run: ansible-lint
